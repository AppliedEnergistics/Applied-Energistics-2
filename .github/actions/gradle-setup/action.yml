name: 'Gradle Setup'
description: 'Set up the basics to run gradle'
runs:
  using: "composite"
  steps:
    - name: Export release tag as environment variable
      shell: bash
      env:
        # Release events and tag pushes both have a tag ref, but only release events have event.release
        TAG: ${{ (github.ref_type == 'tag' && github.ref_name) || github.event.release.tag_name }}
      run: |
        echo "TAG=${TAG}" >> $GITHUB_ENV

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: 'microsoft'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
